name: Build Docsite

on:
  push:
    branches:
      - main

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd api/python
          make docs/install
      - name: Build the docsite
        run: |
          cd api/python
          make docs/build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: api/python/docs/

  # Deploy the artifact to GitHub pages.
  # Skipped unless the repo opts in by setting the `ENABLE_PAGES` repository
  # variable to "true" (Settings > Secrets and variables > Actions > Variables).
  # GitHub Pages is not configured on this fork, so the job is skipped (not
  # failed) by default.
  deploy:
    needs: build
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
